name: tr_business_card_clone1
description: "Business Card Scanner + Multi-Functional Features"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Core UI & State
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^13.1.0
  flutter_easyloading: ^3.0.5
  font_awesome_flutter: ^10.8.0

  # Business Card Scanner
  google_mlkit_text_recognition: ^0.11.0
  google_mlkit_entity_extraction: ^0.11.0
  sqflite: ^2.3.2
  image_picker: ^1.0.7

  # QR / Barcode / Share / Screenshot
  qr_flutter: ^4.1.0
  pretty_qr_code: ^3.4.0
  mobile_scanner: ^7.0.0
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  clipboard: ^0.1.3
  path_provider: ^2.1.5
  path_provider_platform_interface: ^2.1.2
  file_saver: ^0.2.14
  url_launcher: ^6.2.5

  # Calendar
  table_calendar: ^3.2.0
  intl: ^0.20.2

  # Preferences
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.3

flutter:
  uses-material-design: true

  assets:
    - images/
